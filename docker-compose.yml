# ==========================================================
# 应用编排：migrate / backend / celery-worker / celery-beat / nginx
# 依赖基础设施编排创建的网络与数据服务，因此必须先启动：
#   docker compose -f docker-compose.infra.yml up -d
# 再启动本编排：
#   docker compose up -d
#
# 阶段说明：本文件当前为骨架，镜像需在后续阶段（Dockerfile 落地后）构建：
#   docker/backend.Dockerfile    -> home-toolkit-backend
#   docker/frontend.Dockerfile   -> home-toolkit-frontend（多阶段构建产出 dist，打进 nginx 镜像）
# 在镜像构建完成前，本编排的所有服务都带 profile "app"，不会被默认 up 拉起。
# ==========================================================

x-backend-base: &backend-base
  image: home-toolkit-backend:dev
  # build:
  #   context: .
  #   dockerfile: docker/backend.Dockerfile
  #   target: runtime
  profiles:
    - app
  env_file:
    - .env
  networks:
    - home-toolkit-net
  restart: unless-stopped

services:
  # 一次性任务：执行数据库迁移（collectstatic 亦可并入此处）
  migrate:
    <<: *backend-base
    container_name: home-toolkit-migrate
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput"]
    # 跨编排依赖：postgres / redis 在 docker-compose.infra.yml 中定义，
    # compose 不支持跨文件的 depends_on，因此仅以注释记录启动顺序：
    #   1) docker compose -f docker-compose.infra.yml up -d
    #   2) 等待 postgres 健康后再执行 docker compose run --rm migrate
    healthcheck:
      disable: true

  # 后端应用服务（gunicorn + uvicorn worker）
  backend:
    <<: *backend-base
    container_name: home-toolkit-backend
    expose:
      - "8000"
    # ports 不对外暴露：唯一入口是 nginx
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Celery 异步任务进程（日历提醒等）
  celery-worker:
    <<: *backend-base
    container_name: home-toolkit-celery-worker
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Celery 定时调度（django-celery-beat）
  celery-beat:
    <<: *backend-base
    container_name: home-toolkit-celery-beat
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    healthcheck:
      disable: true

  # 唯一对外入口：静态资源 + 反向代理
  nginx:
    image: home-toolkit-nginx:dev
    # build:
    #   context: .
    #   dockerfile: docker/frontend.Dockerfile
    #   target: nginx
    container_name: home-toolkit-nginx
    profiles:
      - app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    # 前端 dist 在多阶段构建中已 COPY 进镜像；如需本地调试可临时挂载：
    # volumes:
    #   - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    #   - ./apps/frontend/dist:/usr/share/nginx/html:ro
    networks:
      - home-toolkit-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # 引用 docker-compose.infra.yml 创建的共享网络
  home-toolkit-net:
    external: true
    name: home-toolkit-net
