# =============================================================================
# 漏洞扫描（五件套中的 Trivy + gitleaks 部分）
#
# 五件套与落点：
#   1) Dependabot            -> .github/dependabot.yml
#   2) dependency-review     -> .github/workflows/dependency-review.yml
#   3) pip-audit             -> .github/workflows/backend.yml
#   4) pnpm audit            -> .github/workflows/frontend.yml
#   5) Trivy + gitleaks      -> 本文件
#
# 为什么 Trivy 既扫源码也扫镜像：
#   - fs 模式：扫仓库里的锁文件/配置（含 IaC 与 secret），不依赖镜像构建；
#   - image 模式：扫实际使用的基础镜像的 OS 包漏洞。
#
# 镜像列表只有一处事实来源：
#   docker/backend.Dockerfile 与 docker/web.Dockerfile 的 FROM 行。
#   base-images job 调用 .github/scripts/base_images.py 实时解析出 JSON matrix，
#   trivy-image 通过 needs + fromJSON 使用，workflow 内不再手写镜像 tag。
#   基础镜像的 tag/digest 由 Renovate（renovate.json，docker:pinDigests）
#   负责固定与更新，从而能捕获「tag 不变但上游镜像被重建」的 digest 变化；
#   Dependabot 继续负责 uv / npm / github-actions，两者职责不重叠。
#
# 私有仓库没有 GHAS 时：
#   - Trivy 的 SARIF 上传（GitHub Security 标签页）会失败，故默认不做 SARIF 上传，
#     只以 exit-code=1 让流水线失败并打印表格定位问题；
#   - secret 扫描用 gitleaks 社区版 CLI（docker 运行，无需 GITLEAKS_LICENSE）；
#     若换成 gitleaks/gitleaks-action，组织仓库需要配置 GITLEAKS_LICENSE secret。
# =============================================================================
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**/pyproject.toml"
      - "apps/**/uv.lock"
      - "apps/**/package.json"
      - "apps/**/pnpm-lock.yaml"
      - "docker/**"
      - ".github/scripts/**"
      - ".github/workflows/security.yml"
  schedule:
    # 每周一 03:00 UTC 复查一次（依赖不变但漏洞库在更新）。
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 有 GHAS 时再打开下面这行，供 Trivy 上传 SARIF 到 Security 标签页：
  # security-events: write

jobs:
  trivy-fs:
    name: Trivy 文件系统扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trivy fs（漏洞 / secret / IaC 配置）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  base-images:
    name: 从 Dockerfile 派生基础镜像矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 解析脚本单元测试
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: 解析 FROM 行并输出 matrix
        id: derive
        run: python3 .github/scripts/base_images.py --github-output >> "$GITHUB_OUTPUT"

  trivy-image:
    name: Trivy 镜像扫描（${{ matrix.name }}）
    runs-on: ubuntu-latest
    needs: base-images
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 镜像列表由 base-images 从 Dockerfile 的 FROM 行派生，不再硬编码。
      matrix: ${{ fromJSON(needs.base-images.outputs.matrix) }}
    steps:
      - name: Trivy image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  gitleaks:
    name: gitleaks（secret 扫描）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout（需要完整历史，才能扫到历史提交里的泄露）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks detect（含历史提交）
        # 用官方 CLI 镜像而非 gitleaks/gitleaks-action：后者在组织仓库需要
        # GITLEAKS_LICENSE，社区版 CLI 无此限制。
        # 不传 --no-git，扫描完整 git 历史（因此上面 fetch-depth: 0 是必需的）。
        # 真实密钥文件 .env 已被 .gitignore 排除，仓库里只有空的 .env.example。
        # --redact 保证日志里不打印明文密钥。
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --verbose --redact --exit-code 1
