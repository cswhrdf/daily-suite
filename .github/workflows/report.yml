# =============================================================================
# Allure 3 聚合报告
#
# 前后端各自把 `allure-results` 传成 artifact（名字固定为
# backend-allure-results / frontend-allure-results），本 workflow 在任一上游
# 流水线结束后把两份结果下载、合并到同一目录，再用 Allure 3 命令行
# （npm 包名 `allure`，bin 名 `allure`，纯 Node 运行时，无需 Java）
# 生成单一 HTML 报告并上传。
#
# 说明：
#   - 用 workflow_run 触发，避免在 backend/frontend 两个 workflow 之间互相依赖。
#   - 用 dawidd6/action-download-artifact 按 workflow 文件名取最近一次成功运行，
#     单个上游缺失（例如只改了前端）不会让聚合失败，只会在报告里少一部分结果。
#   - Allure 3 的结果文件以 UUID 命名，两份 results 直接混到一个目录即可合并。
# =============================================================================
name: Allure Report

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: 合并前后端结果并生成报告
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 上游失败时仍生成报告（失败用例的结果恰恰最需要看），
    # 但被取消的运行不处理。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Checkout（仅用于拿到仓库元信息）
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node（Allure 3 是 Node 运行时）
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: 下载后端 allure-results
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: backend.yml
          workflow_conclusion: success
          name: backend-allure-results
          path: raw/backend
          if_no_artifact_found: warn

      - name: 下载前端 allure-results
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: frontend.yml
          workflow_conclusion: success
          name: frontend-allure-results
          path: raw/frontend
          if_no_artifact_found: warn

      - name: 合并结果目录
        run: |
          set -eu
          mkdir -p merged
          for dir in raw/backend raw/frontend; do
            if [ -d "$dir" ]; then
              cp -R "$dir"/. merged/
              echo "已合并 $dir"
            else
              echo "跳过 $dir（无 artifact）"
            fi
          done
          count=$(find merged -name '*-result.json' | wc -l)
          echo "合并后结果文件数：$count"
          # 后端必然产出结果；为 0 说明上游 artifact 全缺，直接失败提示排查。
          test "$count" -gt 0

      - name: 生成 Allure 报告
        # Allure 3 CLI：`allure generate <resultsDir> --output <dir>`
        # （包名是 allure，不是 @allure/allure；npx 会按需下载，无需 Java）。
        run: npx --yes allure@3 generate merged --output allure-report

      - name: 上传聚合报告
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          # 报告是静态站点：下载后解压，用任意静态服务器打开 index.html
          # （Allure 报告用 file:// 打开可能受浏览器限制）。
          path: allure-report
          if-no-files-found: error
          retention-days: 30
