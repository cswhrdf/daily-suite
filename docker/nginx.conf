# ==========================================================
# daily-suite 统一反向代理（静态资源托管 + API 反向代理）
# 挂载/拷贝路径：/etc/nginx/conf.d/default.conf
#
# 设计约定：
#   - nginx 是唯一对外入口；
#   - /api/ 与 /healthz 转发到 backend（Django，gunicorn + uvicorn worker）；
#   - / 托管前端 dist（多阶段构建产物，COPY 到 /usr/share/nginx/html）；
#   - 富文本图片经 X-Accel-Redirect 内部跳转由 nginx 直接输出 MEDIA 文件。
# ==========================================================

upstream backend_api {
    # backend 为应用编排中的服务名，通过 home-toolkit-net 解析
    server backend:8000;
    keepalive 32;
}

# ----------------------------------------------------------
# 真实协议判定：仅信任来自 docker / 内网网段的 X-Forwarded-Proto
#
# 为什么不能直接用 $scheme：
#   公网访问走 Cloudflare Tunnel（cloudflared 出站隧道），TLS 在 CF 边缘终止，
#   cloudflared 回源到 nginx 时是明文 HTTP，nginx 自身看到的 $scheme 恒为 http。
#   若继续下发 $scheme，Django 依据 SECURE_PROXY_SSL_HEADER 判定为 http，
#   配合 SECURE_SSL_REDIRECT 会不停 301 到 https，再被 CF 转回 http，形成无限重定向。
#   因此必须优先采信上游代理传来的真实协议。
#
# 为什么只信任内网来源：
#   X-Forwarded-Proto 是客户端可自行伪造的头。若无条件信任，局域网内任何人只要
#   发送 "X-Forwarded-Proto: https" 的明文请求，就会被按 HTTPS 放行，
#   从而绕过 SECURE_SSL_REDIRECT / Secure Cookie 的保护。故仅当直连来源
#   （$remote_addr）落在 docker / 内网网段时才采信该头，其余一律回落 $scheme。
#   如需纳入 192.168.0.0/16，请先确认该网段内确实只存在可信代理，
#   否则等于主动扩大伪造面。
#
# 为什么额外信任 127.0.0.1/32：
#   本容器的健康探针从回环地址发起。开启 SECURE_SSL_REDIRECT 后，/healthz 对
#   非 https 请求会 301 到 https，探针无法跟随（容器内没有 TLS 监听）。回环地址
#   不可能被外部客户端占用，因此放开它不会扩大伪造面，仅让探针能以 https 语义探活。
# ----------------------------------------------------------
geo $from_docker {
    default 0;
    127.0.0.1/32 1;
    172.16.0.0/12 1;
    10.0.0.0/8   1;
}

map "$from_docker:$http_x_forwarded_proto" $fwd_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

server {
    # 只监听 80：公网入口是 cloudflared 出站隧道，内网入口是 Caddy(443) DNS-01 证书，
    # 两者都反代到本 server 的 80；证书与 TLS 终止都不在 nginx 这一层。
    #
    # 刻意不加 80 -> 443 的 redirect：
    #   1. 容器健康检查走 http://127.0.0.1/healthz（来源 127.0.0.1，非 docker 网段），
    #      一旦无条件 301 会把 wget 探活打成失败；
    #   2. Caddy / cloudflared 回源也是明文 http，跳转会形成环；
    #   3. 若只对「非 docker 来源且非 /healthz」跳转，语义可行但需要先确认家庭局域网
    #      内没有任何直连 http 的客户端。该取舍留待确认后再加，当前不改变行为。
    listen 80;
    server_name _;

    # 上传体积上限（富文本图片）
    client_max_body_size 20m;

    # 基础安全响应头（CSP 详细策略待后端中间件落地后统一）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 健康检查端点：反向转发后端 /healthz
    location = /healthz {
        proxy_pass http://backend_api/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Django 管理后台（admin 静态资源在 DEBUG 下由 Django 托管；生产后台后续重写）
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection "";
    }

    # 富文本图片：Django 下发 X-Accel-Redirect: /protected-media/...，由 nginx 直接输出
    location /protected-media/ {
        internal;
        alias /srv/media/;   # 与 backend 的 MEDIA_ROOT 共享卷 mediadata（见 docker-compose.yml）
    }

    # 前端 SPA（dist 由多阶段构建 COPY 进镜像）
    location / {
        # web.Dockerfile 已把 apps/web/dist 构建产物拷入该目录
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存（带 hash 的构建产物）
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
