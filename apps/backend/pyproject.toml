[project]
name = "backend"
version = "0.1.0"
description = "daily-suite 后端（Django + DRF）"
requires-python = ">=3.12"

# TODO(deps): 暂降到 Django 6.0 + django-celery-beat 2.9。
# 起因：beat 2.1.0 与 Celery 5.7 的 zoneinfo 用法不兼容，且 Django 6.x 移除了
# timezone.utc 支持，二者叠加导致 beat 启动即报错。
# 待 django-celery-beat v2.10.0 发布并声明支持 Django 6.1 后，再单独评估升回
# Django 6.1 + beat 2.10（含迁回 MAILERS 新式邮件配置），届时删除本注释。
# 跟踪：https://github.com/celery/django-celery-beat/issues/1079
dependencies = [
    "argon2-cffi~=25.1.0",
    "celery~=5.7.0",
    "django~=6.0.10",
    "django-celery-beat~=2.9.0",
    "django-celery-results~=2.6.0",
    "django-environ~=0.14.0",
    "django-filter~=26.2",
    "django-redis~=7.0.0",
    "djangorestframework~=3.18.3",
    "djangorestframework-simplejwt~=5.5.1",
    "drf-spectacular~=0.30.0",
    "gunicorn~=27.0.1",
    "nh3~=0.3.8",
    "packaging~=26.3",
    "pillow~=13.0.0",
    "psycopg[binary]~=3.3.9",
    "pyjwt~=2.15.1",
    "redis~=8.2.0",
    "structlog~=26.1.0",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "allure-pytest~=2.16.2",
    "deptry~=0.25.1",
    "django-stubs~=6.1.2",
    # 3.18.2 起要求 django-stubs>=6.1.2，与 Django 6.0 降级方案冲突，故精确锁定 3.18.0。
    "djangorestframework-stubs==3.18.2",
    "factory-boy~=3.3.3",
    "freezegun~=1.5.5",
    "mypy~=2.4.1",
    "pip-audit~=2.10.1",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.14.0",
    "respx~=0.23.1",
    "ruff~=0.17.6",
]

# 安全静态扫描工具组：仅 CI 使用，本地默认不装。
# 本地开发者执行 uv sync 不会安装本组；CI 中用 uv sync --group ci 额外装入。
#
# semgrep 不进依赖组，改用官方容器镜像在 CI 中执行：
# semgrep 1.186 / 1.187 都硬锁 mcp==1.29.0，而 mcp <1.30.0 命中 GHSA-qx49-fqc8-xw99
# （MCP Python SDK 的 OAuth 客户端可能把凭据发给 MCP 服务器指定的授权服务器，high），
# 会被 dependency-review 与 pip-audit 阻断。semgrep 在本项目只以命令行方式运行，
# 把它整棵 Python 依赖树（mcp、opentelemetry、starlette 等）留在 uv.lock 里没有收益，
# 故改为容器调用；待 semgrep 放开 mcp 版本约束后再评估装回。
ci = [
    "bandit~=1.9.4",
]

# ---------- deptry ----------
# deptry 只做静态 import 扫描，看不到「通过命令行、Django settings 字符串路径或
# 运行期配置间接加载」的依赖，这类会被误报成 DEP002（已声明但代码未使用）。
# 因此按规则逐条登记忽略，并注明理由；新增真实冗余依赖仍会被报出。
[tool.deptry.per_rule_ignores]
DEP002 = [
    # ① 命令行工具：不由代码 import，只在容器入口/启动脚本中执行。
    "gunicorn",  # 生产 WSGI 服务器，Dockerfile 的 CMD 调用
    "uvicorn",  # 生产 ASGI 服务器，Dockerfile 的 CMD 调用（celery 已由 celery.py 显式 import，未被误报）
    # ② 由 Django settings 的字符串路径间接加载，代码里没有对应 import 语句：
    "django-celery-beat",  # INSTALLED_APPS 中注册，提供 admin 可编辑的周期任务表
    "django-celery-results",  # INSTALLED_APPS 中注册，把任务结果持久化到数据库
    "django-filter",  # INSTALLED_APPS + DRF DEFAULT_FILTER_BACKENDS 的字符串路径
    "django-redis",  # CACHES BACKEND / CLIENT_CLASS 使用 "django_redis.*" 字符串
    "psycopg",  # DATABASES ENGINE 为 "django.db.backends.postgresql"，驱动按名加载
    "argon2-cffi",  # PASSWORD_HASHERS 指向 Argon2PasswordHasher，算法后端按名加载
    "redis",  # CELERY_BROKER_URL / 缓存 LOCATION 的连接串驱动，由 celery 与 django-redis 在运行期使用
    # ③ 当前尚未被 import 的预留依赖（功能落地后会被真实使用）：
    "nh3",  # 富文本 HTML 白名单清洗，笔记模块接入时使用
    "pillow",  # Django ImageField 依赖，富文本图片上传接入时使用
    "structlog",  # 结构化日志，日志配置落地时使用
    # ④ 仅在测试中使用：deptry 默认排除 tests/ 目录，所以看不到 `import jwt`。
    #    PyJWT 的导入名是 jwt（tests/test_auth.py 直接用它校验 Access Token 签名），
    #    同时它也是 rest_framework_simplejwt 的核心依赖，故保留在运行期依赖中。
    "pyjwt",
    # ⑤ 由第三方包在运行期间接 import，本项目代码不直接引用：
    #    celery 的 broker 传输层 kombu.transport.redis 会 `from packaging.version import Version`，
    #    kombu 5.7.0 未在自身元数据中声明该依赖，故必须由本项目显式声明，
    #    否则 `uv sync --no-dev` 构建出的运行镜像会报 ModuleNotFoundError: No module named 'packaging'。
    "packaging",
]

# bandit 只存在于 ci 依赖组且从不被 import，deptry 无法自动推断其模块名，
# 这里显式登记（模块名与包名一致），避免每次运行都打印 "Assuming ..." 提示。
[tool.deptry.package_module_name_map]
bandit = "bandit"

# ---------- pytest / coverage ----------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
# 覆盖率随测试一起跑，低于 100% 直接判失败。
# 度量范围同时覆盖 config（配置/认证）与 toolkit（业务应用）。
addopts = "-ra --cov=config --cov=toolkit --cov-fail-under=100"

# ---------- uv 包索引 ----------
# 不显式声明 [[tool.uv.index]]：uv 默认即使用官方 PyPI（https://pypi.org/simple），
# 保证 lock 中所有包都解析自官方源，避免使用镜像源带来的同步延迟与来源不一致。

[tool.coverage.run]
# 度量范围：config（配置与认证装配）与 toolkit（业务应用）。
source = ["config", "toolkit"]
# 分支覆盖同样计入：只有行覆盖 100% 不够，条件分支必须都走到。
branch = true
# 下列文件均为脚手架模板/运行时装配代码，不含可测业务逻辑，故排除：
# - manage.py：Django 命令行入口，仅做环境变量与命令分发；
# - config/asgi.py、config/wsgi.py：部署服务器装配的 ASGI/WSGI 入口，只是把 settings 挂载出去；
# - config/celery.py：Celery 应用装配（读取 settings、自动发现任务），
#   与 asgi/wsgi 同为入口文件，测试只要求被导入，逐行度量没有意义；
# - config/settings/：整个 settings 包（base/dev/prod/test）是纯配置声明，
#   不含业务逻辑，测试期间被导入即视为已覆盖，逐行度量没有意义。
#   覆盖率以绝对路径匹配 omit 模式，故需用前导 "*/" 才能命中整包。
omit = [
    "manage.py",
    "config/asgi.py",
    "config/celery.py",
    "*/config/settings/*",
    "config/wsgi.py",
]

[tool.coverage.report]
# 严格门槛：行覆盖与分支覆盖任一项不达标即失败。
fail_under = 100
show_missing = true

# ---------- ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 启用全部规则；与 Django/中文项目本质冲突或互相矛盾的少数规则在下方逐条豁免。
select = ["ALL"]
ignore = [
    # 版权头策略未确定，强制每个文件写版权声明属于过度刻板要求。
    "CPY001",
    # 与 ruff format 冲突：官方建议启用 formatter 时禁用（尾逗号由 format 统一处理）。
    "COM812",
    # D203 与 D211 互斥（类定义前是否空行），保留 D211；D213 与 D212 互斥（多行 docstring
    # 摘要位置），保留 D212。二者与 ruff format 的默认风格一致。
    "D203",
    "D213",
    # 本项目 docstring 用中文书写并以全角句号“。”结尾，而 pydocstyle 只识别 ASCII 标点，
    # 必然误报，属语言层面的本质冲突。
    "D400",
    "D415",
    # 中文注释/docstring 中的全角标点（，：；（））是刻意书写，不是拼写歧义。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# manage.py 是 Django 官方脚手架：为在未安装 Django 时给出友好提示而采用函数内延迟导入；
# 异常消息直接使用字符串字面量（TRY003/EM101）以保持与官方模板一致。
"manage.py" = ["EM101", "PLC0415", "TRY003"]
# 测试代码：assert 是 pytest 的断言语义本体；HTTP 状态码等字面量可读性优于常量；
# 测试函数无需逐条 docstring；tests 目录按 pytest 约定不使用 __init__.py。
"tests/**" = ["D103", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.isort]
# 本地应用与 config 同为第一方包，避免 isort 把 toolkit 判成第三方而单独分组。
known-first-party = ["config", "toolkit"]

# ---------- mypy / django-stubs ----------
[tool.mypy]
python_version = "3.12"
# 一次性启用全套严格选项（等价于下方逐项开启，故不再重复列出）。
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# 类型检查范围：config（配置与认证）、toolkit（业务应用）与 tests。
files = ["config", "toolkit", "tests"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

# celery 未随包发布 py.typed，strict 模式下按第三方无类型库处理。
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# django-celery-beat / django-celery-results 同样未发布 py.typed：
# django-stubs 插件解析 INSTALLED_APPS 里的模型时会尝试分析它们，需一并豁免。
[[tool.mypy.overrides]]
module = [
    "django_celery_beat",
    "django_celery_beat.*",
    "django_celery_results",
    "django_celery_results.*",
]
ignore_missing_imports = true
